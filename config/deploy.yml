# Kamal v2 deploy config for the CV.
#
# Shares the VPS and the kamal-proxy instance with the other apps on this
# server; routing is by host, so nothing else needs to change when this
# deploys.
#
# Run from the project root:
#   kamal setup       # first time on this server
#   kamal deploy      # afterwards
#   kamal logs -f

service: cv_web

image: sergey-yakushevich/cv-web

servers:
  web:
    - 213.134.31.142

proxy:
  ssl: true
  # Both DNS A records point here, so both get a Let's Encrypt certificate.
  hosts:
    - buildcv.cc
    - www.buildcv.cc
  # `next start` listens on 3000 inside the container.
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3
    timeout: 60

registry:
  server: ghcr.io
  username: sergey-yakushevich
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - TRACKHUB_TOKEN
  clear:
    # Central visitor-tracking API on the internal docker network.
    TRACKHUB_URL: http://tracker:8080
    TRACKHUB_SITE: buildcv.cc
    NODE_ENV: production
    # Read by src/lib/pdf/browser.ts. The Dockerfile installs Alpine Chromium
    # at this path for the PDF route.
    CHROME_PATH: /usr/bin/chromium-browser
    # Inside the volume mounted below, not inside the image.
    DATABASE_PATH: /data/cv.db

# Every user and every CV lives in this file. It must outlive the container:
# without the volume, each deploy would silently start everyone from scratch.
# Nothing else is persisted — PDFs are always rendered on demand.
volumes:
  - "cv_web_data:/data"

# The image carries Chromium, so it is large. Building on the server would
# compete for a disk that already runs at ~86%; build locally and push instead.
builder:
  arch: amd64

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "sh"
